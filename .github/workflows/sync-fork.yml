name: Sync fork from upstream

on:
  schedule:
    # Every 10 minutes. Free tier on public repos = unlimited Actions minutes.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-fork
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream main into fork
    runs-on: ubuntu-latest
    steps:
      - name: Sync via GitHub merge-upstream API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/merge-upstream" \
            -d '{"branch":"main"}')
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)
          echo "status: $status"
          echo "body:   $body"
          # 200 = synced (or already up to date). 409 = merge conflict (means
          # this fork has commits not in upstream — investigate, don't fail
          # the cron just because of that).
          if [ "$status" = "200" ]; then
            echo "::notice::fork synced with upstream"
          elif [ "$status" = "409" ]; then
            echo "::warning::merge conflict — fork has diverged from upstream"
            exit 0
          else
            echo "::error::unexpected status $status"
            exit 1
          fi
